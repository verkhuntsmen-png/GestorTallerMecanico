spring.application.name=refaccionaria
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/refaccionaria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:refaccionaria_user}
spring.datasource.password=${DB_PASSWORD:refaccionaria_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.security.cors-origin=${CORS_ORIGIN:http://localhost:5173,http://localhost:5174}
app.storage.customer-photos-dir=${CUSTOMER_PHOTOS_DIR:uploads/customer-photos}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
