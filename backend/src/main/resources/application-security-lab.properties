# Isolated configuration for authorized local security and load testing.
server.port=8081
spring.datasource.url=${SECURITY_LAB_DB_URL:jdbc:mysql://localhost:3306/refaccionaria_pruebas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SECURITY_LAB_DB_USERNAME:refaccionaria_user}
spring.datasource.password=${SECURITY_LAB_DB_PASSWORD:refaccionaria_pass}
app.security.cors-origin=${SECURITY_LAB_CORS_ORIGIN:http://localhost:5175}
app.security.jwt-secret=${SECURITY_LAB_JWT_SECRET:security-lab-only-change-before-shared-use-2026}
app.security.expose-password-reset-token=${SECURITY_LAB_EXPOSE_PASSWORD_RESET_TOKEN:false}
app.storage.customer-photos-dir=${SECURITY_LAB_PHOTOS_DIR:uploads/security-lab/customer-photos}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.packages-to-scan=com.refaccionaria.auth.controller
