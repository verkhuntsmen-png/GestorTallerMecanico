services:
  mysql:
    image: mysql:latest
    container_name: refaccionaria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: refaccionaria
      MYSQL_USER: refaccionaria_user
      MYSQL_PASSWORD: refaccionaria_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
